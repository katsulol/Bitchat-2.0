name: CI & Build Provenance

on:
  push:
    branches: [ main, phase-6 ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-core:
    name: Rust Format, Clippy, Unit, Proptest & E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check Rust Formatting
        run: cargo fmt --manifest-path core/Cargo.toml -- --check

      - name: Run Clippy Linter (Strict -D warnings)
        run: cargo clippy --manifest-path core/Cargo.toml --all-targets -- -D warnings

      - name: Run Unit & Binary Tests
        run: cargo test --manifest-path core/Cargo.toml --lib --bins

      - name: Run Parser Property & Fuzz Smoke Checks
        run: cargo test --manifest-path core/Cargo.toml --lib proptest

      - name: Run Integration & Phase 6 E2E Tests
        run: cargo test --manifest-path core/Cargo.toml --test "*"

      - name: Run Bounded-Deadline Network & Gateway Integration Suite
        run: timeout 300 cargo test --manifest-path core/Cargo.toml --test test_phase6_trust_persistence_e2e --test test_phase6_release_blockers_e2e

      - name: Export Sanitized Dependency & License Metadata
        run: |
          mkdir -p ci_artifacts
          cargo metadata --manifest-path core/Cargo.toml --format-version 1 > ci_artifacts/cargo_metadata.json
          sha256sum ci_artifacts/cargo_metadata.json > ci_artifacts/cargo_metadata.sha256

      - name: Upload Sanitized Rust Metadata Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-dependency-provenance
          path: ci_artifacts/

  security-hygiene:
    name: Secret Scan & Release Config Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Zero Tracked Keystores, Private Keys, or Signing Secrets
        run: |
          TRACKED_SECRETS=$(git ls-files | grep -E '\.(jks|keystore|p12|key)$|key\.properties$|bitchat_release_secrets' || true)
          if [ -n "$TRACKED_SECRETS" ]; then
            echo "ERROR: Tracked secret or key file detected in repository:"
            echo "$TRACKED_SECRETS"
            exit 1
          fi

      - name: Verify Release Gradle Configuration Disables Dev Overrides & Debug Fallback
        run: |
          grep -q 'buildConfigField("boolean", "ALLOW_DEV_TOPOLOGY_OVERRIDES", "false")' app/android/app/build.gradle.kts
          grep -q 'FAIL-CLOSED RELEASE SIGNING' app/android/app/build.gradle.kts

  flutter-app:
    name: Flutter Analyze & Widget Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Flutter Dependencies
        working-directory: app
        run: flutter pub get

      - name: Run Flutter Analyzer
        working-directory: app
        run: flutter analyze

      - name: Run Flutter Unit & Widget Tests
        working-directory: app
        run: flutter test

  android-provenance:
    name: Android ARM64 Native & Labeled Test APK Provenance
    runs-on: ubuntu-latest
    needs: [rust-core, security-hygiene, flutter-app]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Rust & aarch64-linux-android Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Native ARM64 libbitchat2_core.so
        run: |
          cargo ndk -t arm64-v8a -o app/android/app/src/main/jniLibs build --manifest-path core/Cargo.toml --release

      - name: Build Labeled CI Test APK (Explicit Non-Production Flag)
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release -PallowDebugTestSigning=true

      - name: Generate Sanitized Artifact Provenance Manifest
        run: |
          mkdir -p provenance_out
          GIT_SHA=$(git rev-parse HEAD)
          SO_SHA=$(sha256sum app/android/app/src/main/jniLibs/arm64-v8a/libbitchat2_core.so | awk '{print $1}')
          APK_SHA=$(sha256sum app/build/app/outputs/flutter-apk/app-release.apk | awk '{print $1}')
          cat <<EOF > provenance_out/PROVENANCE_MANIFEST.json
          {
            "git_commit": "$GIT_SHA",
            "expected_abi_version": 2,
            "signing_provenance": "DEBUG_TEST_KEY_NOT_FOR_PRODUCTION",
            "libbitchat2_core_arm64_sha256": "$SO_SHA",
            "apk_sha256": "$APK_SHA"
          }
          EOF
          cat provenance_out/PROVENANCE_MANIFEST.json

      - name: Upload Sanitized Provenance Manifest
        uses: actions/upload-artifact@v4
        with:
          name: android-build-provenance
          path: provenance_out/PROVENANCE_MANIFEST.json
